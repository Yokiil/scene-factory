[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-factory"
version = "0.2.0"
description = "Image + text to high-fidelity MuJoCo MJCF XML with Cordis reversible plugin governance and post-training traces"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
mujoco = ["mujoco>=3.3,<3.4"]

[project.scripts]
scene-factory = "scene_factory.cli:main"

[tool.setuptools]
packages = [
  "scene_factory",
  "scene_factory.core",
  "scene_factory.cordis",
  "scene_factory.cordis.plugins",
  "scene_factory.plugin_api",
  "scene_factory.spatial",
  "scene_factory.studio",
]

[tool.setuptools.package-data]
"scene_factory.studio" = ["static/*", "static/vendor/*"]

[tool.setuptools.data-files]
"share/scene-factory/config" = ["config/cordis.toml", "config/llm.example.json"]
"share/scene-factory/data/assets" = ["data/assets/registry.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
default-groups = ["dev"]
