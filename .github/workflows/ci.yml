name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core Python (3.12)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check scene_factory tests
      - name: Compile
        run: python -B -m compileall -q scene_factory tests
      - name: Test pure-Python core
        run: python -B -m pytest -p no:cacheprovider -q

  mujoco:
    name: MuJoCo integration (Ubuntu 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MuJoCo + dev dependencies
        run: python -m pip install -e ".[dev,mujoco]"
      - name: Verify MuJoCo runtime
        run: python -c "import mujoco, numpy; print(mujoco.__version__)"
      - name: Test full v2 suite with MuJoCo
        run: python -B -m pytest -p no:cacheprovider -q
